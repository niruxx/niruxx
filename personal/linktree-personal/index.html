<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kyle Perez Correa | Links</title>
  <meta name="description" content="Kyle Perez Correa — all my social links in one place." />
  <meta name="theme-color" content="#202124" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Animated morphing color orbs, Google-brand colored -->
  <div class="bg" aria-hidden="true">
    <div class="bg-layer" id="bgLayer">
      <span class="orb orb--a"></span>
      <span class="orb orb--b"></span>
      <span class="orb orb--c"></span>
      <span class="orb orb--d"></span>
    </div>
    <div class="bg-grain"></div>
  </div>

  <header class="topbar">
    <a class="topbar__brand" href="#top" aria-label="Back to top">
      <span class="topbar__mark">KPC</span>
    </a>

    <nav class="topbar__actions" id="topbarActions" aria-label="Quick links">
      <!-- platform shortcut icons injected by js/script.js -->
      <span class="topbar__divider" aria-hidden="true"></span>
      <button class="topbar__icon-btn" id="shareBtn" type="button" aria-label="Share this page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line></svg>
      </button>
      <button class="topbar__icon-btn" id="copyBtn" type="button" aria-label="Copy link to this page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11 4.93"></path><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07L13 19.07"></path></svg>
      </button>
      <button class="topbar__icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </nav>
  </header>

  <main class="page" id="top">
    <section class="profile" id="profile">
      <div class="avatar-wrap">
        <div class="avatar-ring" aria-hidden="true"></div>
        <div class="avatar" id="avatar">
          <span id="avatarInitials">KPC</span>
        </div>
      </div>

      <h1 class="name">Kyle Perez Correa</h1>
      <p class="tagline">Find me across the internet ✨</p>
    </section>

    <section class="links" id="links" aria-label="Social links">
      <!-- Link cards are injected by js/script.js -->
    </section>
  </main>

  <footer class="bottombar">
    <p>- niruxxdaboi -</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/script.js"></script>
</body>
</html>
